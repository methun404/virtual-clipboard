<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Subtle glow backdrop -->
  <circle cx="256" cy="256" r="140" fill="#6366F1" opacity="0.18" filter="url(#glow)" />

  <!-- Clipboard Board Base -->
  <rect x="136" y="128" width="240" height="288" rx="28" fill="#1E2235" stroke="#333852" stroke-width="4" />
  
  <!-- Clipboard Top Clip -->
  <path d="M200 128 V108 C200 96 210 86 222 86 H290 C302 86 312 96 312 108 V128 Z" fill="url(#primaryGrad)" />
  <rect x="226" y="104" width="60" height="10" rx="5" fill="#FFFFFF" opacity="0.8" />

  <!-- Clipboard Lines (Content Mock) -->
  <rect x="176" y="184" width="160" height="12" rx="6" fill="#3B4261" />
  <rect x="176" y="216" width="120" height="12" rx="6" fill="#3B4261" />
  <rect x="176" y="248" width="140" height="12" rx="6" fill="#3B4261" />

  <!-- Glowing Sync / Lightning Energy Overlay -->
  <g filter="url(#glow)">
    <path d="M290 270 L230 360 H270 L240 430 L320 330 H276 L300 270 Z" fill="url(#cyanGrad)" />
  </g>

  <!-- Circular Sync Arrows Ring -->
  <path d="M360 210 A 130 130 0 0 1 380 320" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 6" />
  <path d="M152 302 A 130 130 0 0 1 132 192" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 6" />
</svg>
