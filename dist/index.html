<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ClipSync</title>
  
  <!-- SEO & PWA Meta -->
  <meta name="description" content="Minimal, ultra-fast virtual clipboard manager for Mac, iPhone, and Android.">
  <meta name="theme-color" content="#0e0f12">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- Google Fonts: Inter / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script type="module" crossorigin src="/assets/index-BTUlGAZA.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-C103gzl-.css">
</head>
<body>
  <div class="app-wrap">

    <!-- Minimal Header -->
    <header class="top-nav">
      <div class="nav-brand">
        <span class="logo-mark">⚡</span>
        <span class="app-title">ClipSync</span>
        <button id="btn-room" class="room-pill" title="Click to view QR code or change room">
          <span class="live-dot online" id="status-dot"></span>
          <span id="display-room-id">CLIP-....</span>
        </button>
      </div>

      <div class="nav-actions">
        <!-- Install PWA (Shows only when installable) -->
        <button id="btn-install-pwa" class="btn-subtle hidden" title="Install App">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          <span>Install</span>
        </button>

        <button id="btn-sound" class="btn-icon" title="Toggle Sound">
          <svg id="sound-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="sound-icon-off" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <button id="btn-pair" class="btn-icon" title="Pair Device (QR Code)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </button>

        <button id="btn-settings" class="btn-icon" title="Cloud Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Raycast / Spotlight Style Unified Input Bar -->
    <section class="command-box">
      <div class="command-input-row">
        <svg class="search-lead-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
        </svg>

        <input
          type="text"
          id="main-input"
          class="command-input"
          placeholder="Paste or type link, text, note... (or search clips)"
          autocomplete="off"
          spellcheck="false"
        >

        <div class="command-right-tools">
          <button id="btn-paste-sys" class="btn-tool" title="Paste from clipboard">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            <span>Paste</span>
          </button>
          
          <button id="btn-submit" class="btn-enter" title="Press Enter to sync">
            <span>Sync</span>
            <kbd>↵</kbd>
          </button>
        </div>
      </div>

      <!-- Minimal clean filter chips row -->
      <div class="filter-strip">
        <div class="filter-left">
          <button class="pill-btn active" data-filter="all">All <span class="badge" id="count-all">0</span></button>
          <button class="pill-btn" data-filter="link">Links <span class="badge" id="count-link">0</span></button>
          <button class="pill-btn" data-filter="text">Notes <span class="badge" id="count-text">0</span></button>
          <button class="pill-btn" data-filter="pinned">⭐ Pinned <span class="badge" id="count-pinned">0</span></button>
        </div>

        <div class="filter-right">
          <button id="btn-clear-history" class="btn-clear-text" title="Clear unpinned items">Clear</button>
        </div>
      </div>
    </section>

    <!-- Main Clean Clipboard Stream -->
    <main class="content-stream">
      <div class="stream-loader" id="loading-state">
        <div class="spinner"></div>
      </div>

      <!-- Empty state -->
      <div class="stream-empty hidden" id="empty-state">
        <p class="empty-title">Clipboard is empty</p>
        <p class="empty-hint">Type or paste anything in the bar above, or share directly from your phone.</p>
        <button id="btn-sample" class="btn-sample">Load Sample Clips</button>
      </div>

      <!-- Clips list -->
      <div class="clips-stack" id="clips-list"></div>
    </main>

    <!-- Toasts -->
    <div id="toast-container" class="toast-wrap" aria-live="polite"></div>

    <!-- Modal: Pair Device / QR Code -->
    <div id="modal-pair" class="modal-dim hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-top">
          <h3>Pair Device</h3>
          <button class="btn-close" id="btn-close-pair">✕</button>
        </div>
        <div class="modal-inner text-center">
          <div class="qr-box">
            <div id="qr-canvas-holder"></div>
          </div>
          <p class="qr-text">Scan with your iPhone or Android camera</p>

          <div class="code-box">
            <label>6-Digit Room Code</label>
            <div class="code-row">
              <input type="text" id="pair-room-input" readonly value="CLIP-....">
              <button id="btn-copy-link" class="btn-subtle">Copy Link</button>
            </div>
          </div>

          <div class="switch-box">
            <input type="text" id="input-custom-room" placeholder="Switch Room (e.g. CLIP-4820)" maxlength="12">
            <button id="btn-switch-room" class="btn-subtle">Join</button>
            <button id="btn-new-room" class="btn-subtle">🎲 New</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Settings / Firebase -->
    <div id="modal-settings" class="modal-dim hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-top">
          <h3>Cloud Sync</h3>
          <button class="btn-close" id="btn-close-settings">✕</button>
        </div>
        <div class="modal-inner">
          <p class="settings-hint">
            To sync globally across cellular & different Wi-Fi networks, paste your free Firebase configuration below:
          </p>
          <textarea
            id="firebase-json-input"
            class="settings-textarea"
            rows="5"
            placeholder='{"apiKey": "...", "databaseURL": "...", "projectId": "..."}'
          ></textarea>
          <div class="settings-btn-row">
            <button id="btn-reset-firebase" class="btn-clear-text">Reset to Local</button>
            <button id="btn-save-firebase" class="btn-enter">Save & Connect</button>
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
